{% extends "base.html" %}

{% block body_class %}home-page{% endblock %}

{% block content %}
<style>
    :root {
        --blue: #2f5eb5;
        --green: #22a34a;
        --text: #42536a;
        --panel-shadow: 0 4px 18px rgba(34, 69, 117, 0.08);
    }

    * { box-sizing: border-box; }

    body.home-page {
        margin: 0;
        background: #fff;
        color: var(--text);
        font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .home-page .site-header {
        height: 70px;
        padding: 0 max(32px, calc((100vw - 1380px) / 2));
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--blue);
        color: #fff;
    }

    .home-page .site-header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
    }

    .home-page .menu-button {
        border: 0;
        padding: 0;
        background: transparent;
        color: #fff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
    }

    .home-page .site-nav { display: none; }
    .home-page > hr { display: none; }
    .home-page main { padding: 32px 20px 86px; }

    .home-content {
        width: min(920px, 100%);
        margin: 0 auto;
    }

    .home-panel {
        padding: 28px;
        margin-bottom: 36px;
        border-radius: 16px;
        background: #fff;
        box-shadow: var(--panel-shadow);
    }

    .home-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        color: var(--blue);
        font-size: 25px;
        font-weight: 700;
    }

    .map-pin { font-size: 28px; }
    #shelterMap {
        height: 365px;
        overflow: hidden;
        border-radius: 11px;
    }

    .weather-heading { justify-content: space-between; }
    .refresh-label {
        color: var(--green);
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
    }

    .weather-body {
        padding: 20px 18px 16px;
        border-radius: 11px;
        background: #f8f9fb;
        font-size: 16px;
    }

    .weather-body p { margin: 0 0 12px; }
    .weather-body p:last-child { margin-bottom: 0; }
    .weather-location { font-size: 19px; font-weight: 700; }
    .weather-clear { color: var(--green); font-size: 18px; font-weight: 700; }
    .weather-time { color: #52657b; }
    .weather-time span { color: #42536a; }
    .weather-icon { margin-right: 7px; }

    @media (max-width: 680px) {
        .home-page .site-header { height: 62px; padding: 0 20px; }
        .home-page .site-header h1 { font-size: 23px; }
        .home-page main { padding: 20px 12px 48px; }
        .home-panel { padding: 18px; margin-bottom: 20px; border-radius: 12px; }
        .home-heading { font-size: 20px; margin-bottom: 16px; }
        .refresh-label { font-size: 13px; }
        #shelterMap { height: 280px; }
    }
</style>

<div class="home-content">
    <section class="home-panel">
        <h2 class="home-heading"><span class="map-pin">📍</span>避難所マップ</h2>
        <div id="shelterMap"></div>
    </section>

    <section class="home-panel">
        <h2 class="home-heading weather-heading">
            <span><span class="weather-icon">🌤️</span>青森市 気象警報・注意報</span>
            <span class="refresh-label">⟳ 10分おき自動更新</span>
        </h2>
        <div id="weatherContent" class="weather-body">
            <p>読み込み中...</p>
        </div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="weather-clear">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-clear">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-clear"><span class="weather-icon">●</span>現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location"><span class="weather-icon">📍</span>青森市</p>
            ${warningsHtml}
            <p class="weather-time"><span class="weather-icon">◷</span>データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-time"><span class="weather-icon">◔</span>気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
